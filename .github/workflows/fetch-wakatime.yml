name: Fetch WakaTime Stats

on:
  schedule:
    - cron: "0 6 * * 0"   # cada domingo a las 6:00 UTC
  workflow_dispatch:        # también se puede correr manualmente

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: WAKATIME_API_KEY
    steps:
      - name: Checkout branch wakatime-data
        uses: actions/checkout@v4
        with:
          ref: wakatime-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/fetch_wakatime.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wakatime.json
          git diff --cached --quiet || git commit -m "chore: update WakaTime stats $(date -u '+%Y-%m-%d')"
          git push
